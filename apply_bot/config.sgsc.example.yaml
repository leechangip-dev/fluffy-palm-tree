# 광교복합체육센터(www.sgsc.co.kr) 수영 월 정기권 신청용 설정
#
# 이 사이트는 apply_bot.runner(범용 http/browser 모드)가 아니라
# apply_bot.sgsc_apply 전용 스크립트로 실행합니다:
#   cp config.sgsc.example.yaml config.yaml
#   cp .env.example .env   # SGSC_ID / SGSC_PW 채우기
#   python -m apply_bot.sgsc_apply config.yaml

target:
  name: "광교복합체육센터 수영 월 정기권"
  open_at: "2026-07-24 06:00:00"
  timezone: "Asia/Seoul"

time_sync:
  reference_url: "https://www.sgsc.co.kr/"
  samples: 7

prewarm_lead_seconds: 2.0

sgsc:
  base_url: "https://www.sgsc.co.kr"
  user_id: "${SGSC_ID}"
  user_password: "${SGSC_PW}"

  center: "SUWONSPORTS01"          # URL의 center 파라미터
  event: "1000000000"              # URL의 event 파라미터 (종목: 수영)
  class_category: "1000030000"     # URL의 class 파라미터 (강좌 분류: 월 정기권)

  # 오픈 순간 같은 분류 안에 여러 강좌가 동시에 뜰 수 있습니다.
  # 특정 강좌명(부분 문자열)으로 좁히고 싶으면 채우고, 아니면 빈 문자열로 두면
  # 이 분류에서 접수중(R) 상태로 가장 먼저 나타나는 강좌를 그대로 선택합니다.
  name_contains: ""

  poll_timeout_seconds: 20
  poll_interval_seconds: 0.4
